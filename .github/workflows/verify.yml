name: Verify reference core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-reference:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: .cache/uv
      UV_NO_PROGRESS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned environment manager
        run: python -m pip install uv==0.8.6
      - name: Install locked dependencies
        run: uv sync --locked --extra research --extra benchmarks
      - name: Tests, lint, types, semantic mutations and clean package installs
        run: uv run --locked --extra research --extra benchmarks python scripts/verify.py
